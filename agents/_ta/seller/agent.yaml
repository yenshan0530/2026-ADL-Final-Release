# The TA seller: the same layout as a student's agent folder (agents/example_student/seller/).
#   checkpoint/      the TA seller LoRA: adapter_config.json is in the repository, the weights
#                    are downloaded by  python scripts/download_ta_loras.py
#   persona_1.md ... its personas; a TA agent plays each of them (ta_seller_p1, _p2, _p3)
id: ta_seller
owner: ta
model: ta          # the TA model in configs/models.yaml (by default the same server as yours)
reasoning: true    # TA agents play with thinking mode on
